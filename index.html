<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="phone">
            <header>
                <div class="header-container">
                    <img id="logo" src="images/logo.png" alt="Instagram Logo">
                    <img class="avatar" src="images/user-avatar.jpg">
                </div>
            </header>

            <section class="post">

                <div class="profile-container">
                    <img class="avatar" src="images/avatar-vangogh.jpg" />
                    <div class="profile-info">
                        <h2 class="mtb-0">Vincent van Gogh</h2>
                        <p class="mtb-0">Zundert, Netherlands</p>
                    </div>
                </div>

                <img class="post-img" src="images/post-vangogh.jpg" />

                <div class="bottom-container">  
                    <div class="icon-container">
                        <button class="icon-btn">
                            <img src="images/icon-heart.png" alt="like" />
                        </button>
                        <button class="icon-btn">
                            <img src="images/icon-comment.png" alt="comment" />
                        </button>
                        <button class="icon-btn">
                            <img src="images/icon-dm.png" alt="dm" />
                        </button>
                    </div>

                    <h2 class="likes">21,492 likes</h2>

                    <div class="comments-container">
                        <h3 class="mtb-0">vincey1853</h3>
                        <p class="comment mtb-0">just took a few mushrooms lol</p>
                    </div>
                </div>
            </div>
        </section>




        <script src="index.js"></script>
    </body>
</html>
